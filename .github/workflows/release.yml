name: Release

# Push a tag <id>-v<version> that matches a plugin's plugin.json to publish that plugin:
#   git tag ide-bogota-v0.1.0 && git push origin ide-bogota-v0.1.0
# The plugin's folder is named after its id. The release carries the .rgplugin package and the
# registry entry to submit.
on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTGIS_VERSION: ${{ vars.RUSTGIS_VERSION }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Find the plugin
        run: echo "PLUGIN=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build, check and package
        run: python scripts/package.py "$PLUGIN" --tag "$GITHUB_REF_NAME"
      - name: Download rustgis-cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $RUSTGIS_VERSION --repo opengeos/RustGIS --pattern 'RustGIS-*-linux-x86_64.tar.gz' --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP"/RustGIS-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          echo "RUSTGIS_CLI=$(ls "$RUNNER_TEMP"/RustGIS-*-linux-x86_64/rustgis-cli)" >> "$GITHUB_ENV"
      - name: Run the plugin in RustGIS
        run: python scripts/smoke.py "$PLUGIN" --cli "$RUSTGIS_CLI"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$PLUGIN"
          version="${GITHUB_REF_NAME##*-v}"
          package="dist/$id-$version.rgplugin"
          sha=$(sha256sum "$package" | cut -d' ' -f1)
          {
            echo "Install it in RustGIS from **Plugins › Plugin Manager › Settings › Install From File…**, or with \`rustgis-cli plugins install $id-$version.rgplugin\`."
            echo
            echo "SHA-256: \`$sha\`"
            echo
            echo "To list this version in the [RustGIS plugin registry](https://plugins.rustgis.app), add \`registry/$id.json\` to [opengeos/rustgis-plugins](https://github.com/opengeos/rustgis-plugins) (see the README):"
            echo
            echo '```json'
            cat "dist/$id.json"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$package" "dist/$id.json" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
