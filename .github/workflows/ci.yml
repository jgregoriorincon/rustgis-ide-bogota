name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The RustGIS release the plugins are run in: the latest, unless the RUSTGIS_VERSION repository
  # variable names one (v0.3.0).
  RUSTGIS_VERSION: ${{ vars.RUSTGIS_VERSION }}

jobs:
  # The whole workspace (ide-core is tested in its own repository).
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
      - name: Unit tests
        run: cargo test --workspace

  # Each plugin: packaged and run in RustGIS, as the registry's CI will.
  plugin:
    name: Plugin ${{ matrix.plugin }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [ide-bogota]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build, check and package
        run: python scripts/package.py ${{ matrix.plugin }}
      - name: Download rustgis-cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $RUSTGIS_VERSION --repo opengeos/RustGIS --pattern 'RustGIS-*-linux-x86_64.tar.gz' --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP"/RustGIS-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          echo "RUSTGIS_CLI=$(ls "$RUNNER_TEMP"/RustGIS-*-linux-x86_64/rustgis-cli)" >> "$GITHUB_ENV"
      - name: Run the plugin in RustGIS
        run: python scripts/smoke.py ${{ matrix.plugin }} --cli "$RUSTGIS_CLI"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}
          path: dist/
