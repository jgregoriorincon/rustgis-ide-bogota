[workspace]
# The plugin's folder is named after its id. ide-core, which reads the catalogues, is shared
# with the other ide-* plugins: https://github.com/jgregoriorincon/rustgis-ide-core
members = ["ide-bogota"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ide-core = { git = "https://github.com/jgregoriorincon/rustgis-ide-core", tag = "v0.1.0" }
rustgis-plugin = { git = "https://github.com/opengeos/rustgis-plugins" }
serde_json = "1"

# Small, fast plugin modules. A panic aborts: RustGIS reports it as the plugin failing.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
