[package]
# The crate's name doesn't matter to RustGIS (the plugin's id is in plugin.json), but
# scripts/package.py finds the module by it, so it is the plugin's id.
name = "ide-bogota"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# A plugin is a WebAssembly module: build it with
#   python scripts/package.py ide-bogota
# ("rlib" too, so `cargo test` runs the unit tests on your own computer.)
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ide-core.workspace = true
rustgis-plugin.workspace = true
